<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111113" />
  <link rel="apple-touch-icon-precomposed" sizes="144x144"
    href="/mika1.webp" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Rakko-TwoDollars" />
  <meta name="msapplication-TileColor" content="#000000" />
  <meta name="viewport"
    content="width=device-width,initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <link rel="icon" type="image/webp" href="/mika1.webp" />
  <link rel="shortcut icon" type="image/webp" href="/mika1.webp" />
  <title>Rakko-TwoDollars</title>
  <%- VITE_GTAG_SCRIPT %>
  <script>
    // handle login authorized
    // github login
    if (location.href.includes("github_authorized")) {
      localStorage.setItem("_oauth_res", JSON.stringify({ type: "github", url: location.href }));
      localStorage.setItem("SYNC_ENDPOINT", "github");
      setTimeout(() => {
        location.replace(window.origin);
      }, 1);
    } else if (location.href.includes("gitee_authorized")) {
      localStorage.setItem("_oauth_res", JSON.stringify({ type: "gitee", url: location.href }));
      localStorage.setItem("SYNC_ENDPOINT", "gitee");
      setTimeout(() => {
        location.replace(window.origin);
      }, 1);
    }
  </script>
  <script>
    (function () {
      try {
        const stored = localStorage.getItem("theme");
        if (stored === "dark") {
          document.documentElement.classList.add("dark");
        } else if (stored === "light") {
          document.documentElement.classList.remove("dark");
        } else {
          const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (prefersDark) document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        }
      } catch (e) {
        const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (prefersDark) document.documentElement.classList.add("dark");
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
